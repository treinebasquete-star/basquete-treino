<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plano de Treino Basquete</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: placar no topo (estilo ginásio), faixa de dias, lista de exercícios com controle de status; tudo o mais abre em painéis. */
:root{
  --bg:#E8EDF3; --surface:#FFFFFF; --surface2:#F2F5F9; --ink:#0F1B2D; --muted:#586A80; --line:#D2DBE6;
  --accent:#1B4FD6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFD;
  --board:#0F1B2D; --board-ink:#E9EFF8; --board-dim:#8FA2BC; --led:#FFB627;
  --ok:#1D8A4B; --ok-soft:#DDF3E6; --warn:#A8620A; --warn-soft:#FBEBCF; --danger:#B3261E;
  --c-aq:#C2750A; --c-dr:#1B4FD6; --c-ar:#7A3FD1; --c-fi:#0A8F8F; --c-ll:#C2339A; --c-de:#C0392B; --c-fs:#3A7D1E; --c-ta:#4B5D73; --c-rc:#2A8A6B;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B131F; --surface:#131E2F; --surface2:#1A283C; --ink:#E8EEF6; --muted:#90A2B9; --line:#26364E;
  --accent:#6C97FF; --accent-ink:#0B131F; --accent-soft:#1B2C52;
  --board:#070D16; --board-ink:#E9EFF8; --board-dim:#7F93AE; --led:#FFB627;
  --ok:#47C47D; --ok-soft:#163626; --warn:#E8A93F; --warn-soft:#3A2B10; --danger:#FF8A80;
  --c-aq:#E8A93F; --c-dr:#7DA2FF; --c-ar:#B08CF0; --c-fi:#3CC4C4; --c-ll:#F078C8; --c-de:#FF8A7A; --c-fs:#7CC45A; --c-ta:#9FB1C8; --c-rc:#4FCBA2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B131F; --surface:#131E2F; --surface2:#1A283C; --ink:#E8EEF6; --muted:#90A2B9; --line:#26364E;
  --accent:#6C97FF; --accent-ink:#0B131F; --accent-soft:#1B2C52;
  --board:#070D16; --board-ink:#E9EFF8; --board-dim:#7F93AE; --led:#FFB627;
  --ok:#47C47D; --ok-soft:#163626; --warn:#E8A93F; --warn-soft:#3A2B10; --danger:#FF8A80;
  --c-aq:#E8A93F; --c-dr:#7DA2FF; --c-ar:#B08CF0; --c-fi:#3CC4C4; --c-ll:#F078C8; --c-de:#FF8A7A; --c-fs:#7CC45A; --c-ta:#9FB1C8; --c-rc:#4FCBA2;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:14px;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}

/* placar */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:18px 18px 16px;position:relative;overflow:hidden}
.court{position:absolute;right:-30px;top:-20px;width:300px;height:auto;color:var(--board-ink);opacity:.09;pointer-events:none}
.board-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;position:relative}
.board h1{font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.board .sub{color:var(--board-dim);font-size:13px;margin-top:6px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:100%}
.who{font-size:13px;color:var(--board-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.who button{background:none;border:0;color:var(--led);text-decoration:underline;padding:0;font-size:12px}
.coachbtn{background:transparent;color:var(--board-ink);border-color:rgba(255,255,255,.3)}
.coachbtn[aria-pressed="true"]{background:var(--led);color:#0F1B2D;border-color:var(--led)}
.nameform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.nameform label{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nameform p{margin:0 0 8px;color:var(--muted);flex-basis:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stu{border-top:1px solid var(--line);padding:10px 0}
.stu:first-of-type{border-top:0}
.stu-h{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(80px,1fr) 100px 110px auto;gap:10px;align-items:center}
.stu-h .nm{font-weight:600;overflow-wrap:anywhere}
.stu-h .nums{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stu-d{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:var(--r);padding:12px}
.stu-d h4{margin:0 0 4px;font-family:var(--font-display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.stu-d .ln{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:13.5px;padding:2px 0;overflow-wrap:anywhere}
.stu-d .ln em{font-style:normal;color:var(--muted)}
.st-Concluído{color:var(--ok);font-weight:600}.st-EmAndamento{color:var(--warn);font-weight:600}.st-Pendente{color:var(--muted)}
.notice{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:var(--muted)}
.sync{font-size:12px;color:var(--board-dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--board-dim);display:inline-block}
.sync.ok i{background:#47C47D}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px;position:relative}
.stat{border-top:1px solid rgba(255,255,255,.16);padding-top:8px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1;color:var(--led);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stat span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--board-dim);margin-top:4px}
.board .bar{height:5px;background:rgba(255,255,255,.14);margin-top:14px;position:relative}
.board .bar i{background:var(--led)}

.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.bar.ok i{background:var(--ok)}

/* navegação */
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);margin-bottom:-1px;font-size:15px}
.nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .n{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.day .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .bar{width:70%;height:4px;margin-top:3px}
.day .t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;height:12px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] .c{color:var(--bg);opacity:.75}
.day[aria-pressed="true"] .t{color:var(--led)}
.day[aria-pressed="true"] .bar{background:rgba(127,127,127,.35)}
.day[aria-pressed="true"] .bar i{background:var(--led)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dayhead{display:flex;flex-direction:column;gap:12px}
.dayhead .row1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.dayhead h2{font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.dayhead .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.title-in{border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;font-size:15px;color:var(--muted);width:100%;min-width:0}
.title-in:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:2px;color:transparent}
.dot[data-s="Em Andamento"]{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot[data-s="Concluído"]{border-color:var(--ok);background:var(--ok);color:#fff}
.dot svg{width:16px;height:16px}
.ibody{min-width:0;display:flex;flex-direction:column;gap:6px}
.imeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.imeta .mv{margin-left:auto;display:flex;gap:4px}
.iname{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item[data-s="Concluído"] .iname{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.idesc{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tip{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.result{font-size:13px;color:var(--ok);font-weight:600}
.irow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:6px 10px;font-size:13px;font-weight:500;color:var(--muted);min-height:32px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{color:#fff;font-weight:600}
.seg button[data-v="Pendente"][aria-pressed="true"]{background:var(--muted)}
.seg button[data-v="Em Andamento"][aria-pressed="true"]{background:var(--warn)}
.seg button[data-v="Concluído"][aria-pressed="true"]{background:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.editp{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.editp label,.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
.editp .wide{grid-column:1/-1}
.fld{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px 10px;font-size:15px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);width:100%;min-width:0}
.fld:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.fld{resize:vertical;min-height:60px}

.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:3px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--ink));white-space:nowrap}
.cat-aq{--c:var(--c-aq)}.cat-dr{--c:var(--c-dr)}.cat-ar{--c:var(--c-ar)}.cat-fi{--c:var(--c-fi)}.cat-ll{--c:var(--c-ll)}.cat-de{--c:var(--c-de)}.cat-fs{--c:var(--c-fs)}.cat-ta{--c:var(--c-ta)}.cat-rc{--c:var(--c-rc)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-size:22px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
.empty p{margin:0;max-width:44ch}

/* filtros e listas de exercícios */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;min-height:30px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.exrow:first-child{border-top:0}
.exrow .n{font-weight:600;overflow-wrap:anywhere}
.exrow .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.exrow .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .fld{flex:1 1 200px}

/* semana */
.wk{display:grid;grid-template-columns:110px minmax(0,1fr) 70px 120px 64px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk .dn{font-family:var(--font-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.wk .nums{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.hist{display:grid;grid-template-columns:140px minmax(0,1fr) 80px;gap:10px;align-items:center;padding:6px 0;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
h3.sec{font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}

/* painéis modais */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,18,.62);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:92%;display:flex;flex-direction:column;border-radius:10px 10px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;gap:12px}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:10px;max-height:86%}}
.mh{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.mh h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.mh .sub{color:var(--muted);font-size:13px;flex:1 1 auto}
.plist{overflow:auto;min-height:120px;flex:1 1 auto;border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.mf{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .wide{grid-column:1/-1}
.opt{display:flex;flex-direction:column;gap:6px}
.opt h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tpl{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.tpl h3{font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.tpl p{margin:0;color:var(--muted);font-size:13.5px}
.tpl .acts{margin-top:4px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gen-prev{border:1px solid var(--line);border-radius:var(--r);padding:0 12px;max-height:260px;overflow:auto}
.gen-prev .exrow{grid-template-columns:minmax(0,1fr) auto}

/* modo treino */
.live{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:10px 0}
.live .step{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.live h2{font-size:clamp(28px,6vw,40px);line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.live .dose{font-family:var(--font-display);font-size:clamp(34px,9vw,54px);font-weight:700;color:var(--accent);line-height:1}
.live .count{font-family:var(--font-display);font-size:clamp(84px,24vw,140px);font-weight:700;line-height:1;color:var(--led);background:var(--board);padding:6px 28px;border-radius:var(--r);font-variant-numeric:tabular-nums}
.live .tip{max-width:46ch;text-align:left}
.live .acts{justify-content:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:14px;font-weight:500;max-width:90%}

@media(max-width:720px){
  .wk{grid-template-columns:1fr auto;grid-template-areas:"dn open" "tt tt" "bar nums"}
  .wk .dn{grid-area:dn}.wk .ttl{grid-area:tt}.wk .bar{grid-area:bar}.wk .nums{grid-area:nums;text-align:right}.wk .open{grid-area:open}.wk .min{display:none}
  .hist{grid-template-columns:100px minmax(0,1fr) 64px}
}
@media(max-width:720px){.stu-h{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm go" "bar nums"}.stu-h .nm{grid-area:nm}.stu-h .go{grid-area:go}.stu-h .bar{grid-area:bar}.stu-h .nums{grid-area:nums;text-align:right}.stu-h .last{display:none}}
@media(max-width:520px){
  .editp{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .day .n{font-size:15px}
  .stats{gap:8px}
  .stat span{font-size:10px;letter-spacing:.04em}
  .item{grid-template-columns:30px minmax(0,1fr);padding:12px}
  .dot{width:26px;height:26px}
  .seg button{padding:6px 7px;font-size:12px}
  .court{width:220px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app">
  <section class="board" aria-label="Resumo da semana">
    <svg class="court" viewBox="0 0 300 280" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
      <rect x="95" y="0" width="110" height="140"/><circle cx="150" cy="140" r="55"/><path d="M95 0v20M205 0v20M20 0v96a130 130 0 0 0 260 0V0"/><circle cx="150" cy="40" r="10"/>
    </svg>
    <div class="board-top">
      <div>
        <h1>Plano de Treino · Basquete</h1>
        <div class="sub" id="weeklbl"></div>
      </div>
      <div class="side">

  var q=await SB.from('professores').select('user_id').eq('user_id',u.id);
  if(q.error||!q.data||!q.data.length){await SB.auth.signOut();gateShow(loginHTML('Esta conta não tem acesso de professor.'));return;}
  isCoach=true;ui.coachOn=true;me.id=u.id;DB=SB;progRef=null;
  var c=await SB.from('config').select('plano').eq('id',1).maybeSingle();
  if(c.data&&c.data.plano){plan=normPlan(c.data.plano);plans.geral=plan;}
  else{plans.geral=plan;ui.target='geral';savePlan();}
  gateHide();render();await loadAll();setInterval(loadAll,20000);
}
async function loadAll(){
  if(!SB||!isCoach)return;
  var a=await SB.from('alunos').select('*').order('nome'),c=await SB.from('config').select('plano').eq('id',1).maybeSingle();
  if(a.error){panelErr=a.error.code||'erro';panelLoaded=true;tick();return;}
  panelErr='';
  students=a.data.map(function(r){var p=normProg(r.progresso);p.docId=r.id;p.nome=r.nome;p.token=r.token;return p;});
  var np={};if(c.data&&c.data.plano)np.geral=normPlan(c.data.plano);else if(plans.geral)np.geral=plans.geral;
  a.data.forEach(function(r){if(r.plano)np[r.id]=normPlan(r.plano);});
  plans=np;
  var cur=plans[ui.target];
  if(!cur){ui.target='geral';cur=plans.geral;plan=cur;}
  else if(cur.updatedAt>=plan.updatedAt)plan=cur;else plans[ui.target]=plan;
  if(!CM()&&plans.geral)plan=plans.geral;
  panelLoaded=true;tick();
}
async function addStudent(f){
  var fd=new FormData(f),nome=String(fd.get('nome')||'').trim();if(!nome)return;
  var r=await SB.from('alunos').insert({nome:nome,contato:String(fd.get('contato')||'').trim()}).select().single();
  if(r.error){toast('Não foi possível cadastrar o aluno');return;}
  await loadAll();ui.open=r.data.id;renderMain();toast('Aluno cadastrado. Use “Copiar link do aluno”.');
}
async function enterStudent(){
  GK='tb2-prog-'+TOKEN;PK='tb2-plan-'+TOKEN;
  var r=await SB.rpc('aluno_get',{p_token:TOKEN});
  if(r.error||!r.data){gateShow('<h2>Link inválido</h2><p>Este link não existe ou foi desativado. Peça um novo link ao seu professor.</p>');return;}
  var srv=normProg(r.data.progresso),loc=normProg(readLocal(GK));
  prog=loc.updatedAt>srv.updatedAt?loc:srv;prog.nome=r.data.nome;prog.uid=TOKEN;
  plan=normPlan(r.data.plano);writeLocal(PK,plan);planReady=true;
  progRef={set:function(o){return SB.rpc('aluno_save',{p_token:TOKEN,p_progresso:JSON.parse(o.json)}).then(function(x){if(x.error)throw x.error;});}};
  reconcile();gateHide();render();
  if(prog.updatedAt>srv.updatedAt)flushProg();else{syncState='ok';setSync();}
  document.addEventListener('visibilitychange',async function(){
    if(document.hidden||wProg)return;var q=await SB.rpc('aluno_get',{p_token:TOKEN});
    if(q.data){plan=normPlan(q.data.plano);writeLocal(PK,plan);reconcile();render();}
  });
}

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function dayObj(k){return DAYS.filter(function(d){return d.k===k})[0];}
function vp(){return (CM()&&ui.target!=='geral')?(students.filter(function(p){return p.docId===ui.target})[0]||normProg(null)):prog;}
function planOf(id){return plans[id]||plans.geral||plan;}
function stOf(id){var p=vp().items[id];return (p&&p.s)||'Pendente';}
function vi(it){var p=vp().items[it.id]||{};return Object.assign({},it,{status:p.s||'Pendente',result:p.r||'',note:p.n||''});}
function pr(id){return prog.items[id]||(prog.items[id]={});}
function dayStats(k){var l=plan.days[k]||[];var done=l.filter(function(i){return stOf(i.id)==='Concluído'}).length;var min=l.reduce(function(a,i){return a+(+i.min||0)},0);return {total:l.length,done:done,min:min};}
function weekStats(){var t=0,d=0,m=0;DAYS.forEach(function(x){var s=dayStats(x.k);t+=s.total;d+=s.done;m+=s.min});return {total:t,done:d,min:m,rate:t?Math.round(d/t*100):0,left:t-d};}
function fmtMin(m){if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+'h'+(r?String(r).padStart(2,'0'):'');}
function findItem(id){for(var i=0;i<DAYS.length;i++){var k=DAYS[i].k,l=plan.days[k];for(var j=0;j<l.length;j++)if(l[j].id===id)return {k:k,j:j,it:l[j]};}return null;}
function restSecs(s){s=String(s||'');var m=s.match(/(\d+)\s*min/i);if(m)return +m[1]*60;m=s.match(/(\d+)\s*s/i);return m?+m[1]:0;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400);}
function chip(cat){return '<span class="chip cat-'+esc(cat)+'">'+esc(CATS[cat]||cat)+'</span>';}
var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
function weekLabel(){
  var n=new Date(),dow=(n.getDay()+6)%7,a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
  return 'Semana de '+fmtShort(a)+' a '+fmtShort(b);
}
function ago(ts){
  if(!ts)return 'sem registro';
  var d=Math.floor((Date.now()-ts)/86400000);
  return d<=0?'hoje':d===1?'ontem':'há '+d+' dias';
}

/* painel da turma */
function calc(p){
  var pl=planOf(p.docId),cur=p.weekId===pl.weekId,done=0,total=0,perDay={};
  DAYS.forEach(function(d){var l=pl.days[d.k],dn=0;l.forEach(function(it){var x=p.items&&p.items[it.id];if(cur&&x&&x.s==='Concluído')dn++;});perDay[d.k]={done:dn,total:l.length};done+=dn;total+=l.length;});
  return {cur:cur,done:done,total:total,rate:total?Math.round(done/total*100):0,perDay:perDay};
}

  var o='<option value="geral"'+(ui.target==='geral'?' selected':'')+'>Turma toda (treino padrão)</option>'+students.filter(function(p){return p.docId!==me.id}).map(function(p){return '<option value="'+esc(p.docId)+'"'+(ui.target===p.docId?' selected':'')+'>'+esc(p.nome||'Aluno sem nome')+(plans[p.docId]?' · individual':'')+'</option>'}).join('');

   (ui.target==='geral'?'<div style="margin-top:6px">Quem não tem treino individual vê este. Ao escolher um aluno, ele ganha um treino só dele (copiado deste), sem perder o progresso.</div>':'<div style="margin-top:6px">Treino individual: só este aluno vê estas mudanças. <button type="button" class="btn sm" data-act="unplan">Voltar ao treino da turma</button></div>')+'</div>';

    if(open){

        }).join('')+'</div>';
      }).join('')+'<div class="acts"><button type="button" class="btn sm primary" data-act="ptarget" data-id="'+esc(p.docId)+'">Montar treino deste aluno</button><button type="button" class="btn sm" data-act="plink" data-id="'+esc(p.docId)+'">Copiar link do aluno</button></div>'+(mine?'':'<div><button type="button" class="btn sm danger" data-act="pdel" data-id="'+esc(p.docId)+'">Remover aluno do painel</button></div>')+'</div>';
    }

  }).join('')+'</div></section>';
  return h;
}

var FOCOS={completo:'Completo',arremesso:'Arremesso',drible:'Drible e finalização',defesa:'Defesa',fisico:'Físico',jogo:'Jogo e tática',recuperacao:'Recuperação'};
var FSEQ={arremesso:['ar','ar','ll','fi'],drible:['dr','dr','fi','ar'],defesa:['de','de','fs','ta'],fisico:['fs','fs','de','dr'],jogo:['ta','ta','ar','ll'],completo:['dr','ar','de','fs','fi','ll','ta'],recuperacao:['rc','rc','rc','rc']};
function generate(focus,minutes){
  var out=[],total=0,used={};
  function pick(cat,max){
    var c=shuffle(allEx().filter(function(e){return e.cat===cat&&!used[e.id]&&e.min<=max}))[0];
    if(c){used[c.id]=1;out.push(c);total+=c.min;}return c;
  }
  if(focus!=='recuperacao')pick('aq',minutes>=45?15:10);
  var reserve=(focus!=='recuperacao'&&minutes>=45)?10:0;
  var seq=FSEQ[focus],i=0,fails=0;
  while(total<minutes-reserve&&fails<seq.length){var cat=seq[i++%seq.length];if(pick(cat,minutes-reserve-total))fails=0;else fails++;}
  if(reserve)pick('rc',Math.min(10,minutes-total+2));
  return out;
}
function openGen(){G={focus:'completo',min:60,mode:'replace',list:[]};G.list=generate(G.focus,G.min);renderGen(true);}

   '<div class="opt"><h4>Ao aplicar</h4><div class="seg" style="align-self:flex-start"><button type="button" data-act="gmode" data-v="replace" aria-pressed="'+(G.mode==='replace')+'" style="'+(G.mode==='replace'?'background:var(--accent);color:var(--accent-ink)':'')+'">Substituir o dia</button><button type="button" data-act="gmode" data-v="append" aria-pressed="'+(G.mode==='append')+'" style="'+(G.mode==='append'?'background:var(--accent);color:var(--accent-ink)':'')+'">Adicionar ao final</button></div></div>'+

/* modo treino */
function curItem(){var f=findItem(S.ids[S.i]);return f?f.it:null;}
function setStatus(id,v){pr(id).s=v;saveProg();}
function startSession(){
  var ids=plan.days[ui.day].filter(function(i){return stOf(i.id)!=='Concluído'}).map(function(i){return i.id});
  if(!ids.length){toast('Todos os exercícios deste dia já estão concluídos.');return;}
  S={day:ui.day,ids:ids,i:0,phase:'work',left:0,timer:null,prev:{}};
  enterWork();
  openModal('',function(){if(S&&S.timer)clearInterval(S.timer);S=null;render();});
  renderSession();
}
function enterWork(){
  S.phase='work';var it=curItem();
  if(it&&stOf(it.id)==='Pendente'){S.prev[it.id]='Pendente';setStatus(it.id,'Em Andamento');}
}
function advance(){
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  S.i++;
  if(S.i>=S.ids.length){S.phase='done';}else enterWork();
  renderSession();
}
function renderSession(){
  var n=S.ids.length,html;
  if(S.phase==='done'){
    var st=dayStats(S.day);
    html='<div class="live"><span class="step">Treino encerrado</span><h2>'+(st.done===st.total?'Treino completo':'Bom trabalho')+'</h2><p style="margin:0;color:var(--muted)">'+st.done+' de '+st.total+' exercícios concluídos hoje.</p><div class="acts"><button type="button" class="btn primary" data-act="close">Fechar</button></div></div>';
  }else if(S.phase==='rest'){
    var nx=findItem(S.ids[S.i+1]);
    html='<div class="live"><span class="step">Descanso · exercício '+(S.i+1)+' de '+n+' concluído</span><div class="count" id="count">'+S.left+'</div><p style="margin:0;color:var(--muted)">A seguir: <b style="color:var(--ink)">'+esc(nx?nx.it.name:'')+'</b></p><div class="acts"><button type="button" class="btn primary" data-act="sskiprest">Pular descanso</button><button type="button" class="btn" data-act="close">Sair</button></div></div>';
  }else{
    var it=curItem();
    html='<div class="live"><span class="step">Exercício '+(S.i+1)+' de '+n+'</span>'+chip(it.cat)+'<h2>'+esc(it.name)+'</h2>'+(it.desc?'<p style="margin:0;color:var(--muted)">'+esc(it.desc)+'</p>':'')+'<div class="dose">'+esc(it.dose)+'</div><span class="step">Descanso '+esc(it.rest)+'</span>'+(it.tip?'<div class="tip">'+esc(it.tip)+'</div>':'')+
     '<div class="acts"><button type="button" class="btn primary" data-act="sdone">Concluí este exercício</button><button type="button" class="btn" data-act="sskip">Pular</button><button type="button" class="btn ghost" data-act="close">Sair</button></div></div>';
  }
  setSheet(html);
}
function sessionDone(){
  var it=curItem();setStatus(it.id,'Concluído');renderHeader();
  var secs=restSecs(it.rest);
  if(S.i<S.ids.length-1&&secs>0){
    S.phase='rest';S.left=secs;renderSession();
    S.timer=setInterval(function(){S.left--;var c=document.getElementById('count');if(c)c.textContent=S.left;if(S.left<=0){advance();}},1000);
  }else advance();
}

document.addEventListener('click',function(e){
  var m=document.getElementById('modal');
  if(e.target===m){if(S&&S.phase!=='done'){return;}closeModal();return;}
  var t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  var f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.in;
  if(t.id==='pq'&&P){P.q=t.value;renderPicker();return;}
  if(!k)return;
  if(k==='title'){if(CM()){plan.titles[t.dataset.d]=t.value;savePlan();}return;}
  if(k==='libq'){ui.lib.q=t.value;renderLibList();return;}
  if(k==='libday'){ui.lib.day=t.value;return;}
  var f=findItem(t.dataset.id);if(!f)return;
  if(k==='result'||k==='note'){if(CM())return;pr(f.it.id)[k==='result'?'r':'n']=t.value;saveProg();renderHeader();return;}
  if(!CM())return;
  if(k==='min')f.it.min=Math.max(0,+t.value||0);else f.it[k]=t.value;
  savePlan();renderHeader();
});
document.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.in==='libday')ui.lib.day=e.target.value;
  if(e.target.dataset&&e.target.dataset.in==='aud')setTarget(e.target.value);
});
document.addEventListener('submit',function(e){
  var id=e.target.id;
  if(id==='loginform'){e.preventDefault();doLogin(e.target);return;}
  if(id==='newstu'){e.preventDefault();addStudent(e.target);return;}
  if(id==='nameform'){
    e.preventDefault();var v=String(new FormData(e.target).get('nome')||'').trim();if(!v)return;
    prog.nome=v;saveProg();if(!document.getElementById('modal').hidden)closeModal();render();toast('Nome salvo');return;
  }
  if(id!=='exform')return;e.preventDefault();
  var fd=new FormData(e.target),xid=e.target.dataset.id;
  var o={name:String(fd.get('name')||'').trim(),cat:fd.get('cat'),min:Math.max(1,+fd.get('min')||10),dose:String(fd.get('dose')||'').trim(),rest:String(fd.get('rest')||'').trim()||'-',desc:String(fd.get('desc')||'').trim(),tip:String(fd.get('tip')||'').trim()};
  if(!o.name)return;
  if(xid){plan.custom=plan.custom.map(function(x){return x.id===xid?Object.assign({},x,o):x});}
  else{o.id='c'+uid();plan.custom.push(o);}
  var b=openExForm.back;savePlan();closeModal();
  if(b){openPicker(b);}
  render();toast(xid?'Exercício atualizado':'Exercício criado');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal();});

reconcile();
render();
})();
